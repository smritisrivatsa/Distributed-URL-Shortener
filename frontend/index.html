<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snip — URL Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">snip<span>.</span></div>
      <div class="tagline">Distributed URL Shortener</div>
    </header>

    <div class="card">
      <div class="input-row">
        <input type="text" id="longUrl" placeholder="https://your-very-long-url.com/goes/here" />
        <button id="shortenBtn" onclick="shortenUrl()">Shorten</button>
      </div>

      <div class="error-msg" id="errorMsg">Something went wrong. Please try again.</div>

      <div class="result" id="result">
        <div class="result-label">Your short link</div>
        <div class="result-box">
          <a class="short-link" id="shortLink" href="#" target="_blank"></a>
          <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Copy</button>
        </div>
        <div class="original-url" id="originalUrl"></div>
      </div>
    </div>

    <footer>paste long. get short. snip it.</footer>
  </div>

  <script>
    const IS_LOCAL = window.location.hostname === 'localhost';
    const WRITE_URL = IS_LOCAL ? 'http://localhost:3001' : 'https://snip-it.click';
    const REDIRECT_URL = IS_LOCAL ? 'http://localhost:3002' : 'https://go.snip-it.click';

    let currentShortUrl = '';

    async function shortenUrl() {
      const input = document.getElementById('longUrl');
      const longUrl = input.value.trim();
      const btn = document.getElementById('shortenBtn');
      const errorMsg = document.getElementById('errorMsg');
      const result = document.getElementById('result');

      if (!longUrl) return;

      errorMsg.classList.remove('visible');
      result.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Snipping...';

      try {
        const response = await fetch(`${WRITE_URL}/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ longUrl })
        });

        if (!response.ok) throw new Error('Failed');

        const data = await response.json();
        const shortUrl = `${REDIRECT_URL}/${data.shortCode}`;
        currentShortUrl = shortUrl;

        const linkEl = document.getElementById('shortLink');
        linkEl.href = shortUrl;
        linkEl.textContent = shortUrl;

        document.getElementById('originalUrl').textContent = `↳ ${longUrl}`;
        document.getElementById('copyBtn').textContent = 'Copy';
        document.getElementById('copyBtn').classList.remove('copied');

        result.classList.add('visible');
      } catch (e) {
        errorMsg.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    async function copyUrl() {
      if (!currentShortUrl) return;
      await navigator.clipboard.writeText(currentShortUrl);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    }

    document.getElementById('longUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });
  </script>
</body>
</html>
